<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Web</title>
    <!-- Link the CSS file (样式文件) -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Hello, !!!</h1>

    <!-- A link to another page (跳转到另一个页面的链接) -->
    <a href="notes.html" class="link">Learning notes →</a>

    <!-- A row of 3 cards (一排三张卡片) -->
    <div class="card-row">
        <div class="card">
            <h2>HTML</h2>
            <p>Content and structure</p>
        </div>
        <div class="card">
            <h2>CSS</h2>
            <p>How it looks</p>
        </div>
        <div class="card">
            <h2>JavaScript</h2>
            <p>How it behaves</p>
        </div>
    </div>

    <!-- A button that JavaScript controls (由 JS 控制的按钮) -->
    <button id="theme-button">Change color</button>

    <!-- Link the JavaScript file (脚本文件) -->
    <script src="script.js"></script>
</body>
</html>
